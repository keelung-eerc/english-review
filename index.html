<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>學力測驗題型複習命題</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
:root{
  --ink:#0F2A3D; --bg:#FFFFFF; --mist:#EEF4F6; --line:#D2DFE4; --muted:#51656F;
  --teal:#1C7C8C; --teal-d:#12596A; --on-teal:#FFFFFF;
  --coral:#D6432F; --coral-bg:#FDECE9; --ok:#1B7F5A; --ok-bg:#E3F4EC; --gold:#F2B84B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E6F0F3; --bg:#0D1A23; --mist:#15293A; --line:#264257; --muted:#9DB3BE;
    --teal:#5BC0CF; --teal-d:#8DD6E1; --on-teal:#0D1A23;
    --coral:#FF8D7B; --coral-bg:#3A1F1C; --ok:#58D3A0; --ok-bg:#12332A;
  }
}
:root[data-theme="dark"]{
  --ink:#E6F0F3; --bg:#0D1A23; --mist:#15293A; --line:#264257; --muted:#9DB3BE;
  --teal:#5BC0CF; --teal-d:#8DD6E1; --on-teal:#0D1A23;
  --coral:#FF8D7B; --coral-bg:#3A1F1C; --ok:#58D3A0; --ok-bg:#12332A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.65}
.wrap{max-width:860px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{font-family:"Noto Serif TC","PMingLiU",serif;line-height:1.3;margin:0}
h1{font-size:clamp(26px,5vw,36px)}
h2{font-size:22px;margin-bottom:12px}
h3{font-size:18px;margin-bottom:8px}
.lede{color:var(--muted);margin:8px 0 22px;max-width:36em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:24px}
.tab{background:none;border:0;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}
.panel{background:var(--mist);border-radius:14px;padding:20px;margin-bottom:22px}
.field{margin-bottom:18px}
.field>.lab{font-weight:700;margin-bottom:8px;display:block}
.chips,.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip,.segbtn{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 16px;font-size:15px}
.chip[aria-pressed="true"],.segbtn[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:var(--teal);font-weight:700}
input[type=text]{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;background:var(--teal);color:var(--on-teal)}
.btn:hover{background:var(--teal-d);color:#fff}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.ghost:hover{background:var(--mist);color:var(--teal-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--mist);color:var(--teal-d);border:1px solid var(--line)}
.tag.ai{background:var(--coral-bg);color:var(--coral);border-color:transparent}
.notice{background:var(--coral-bg);color:var(--coral);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:15px}
.loading{padding:40px 10px;text-align:center;color:var(--muted)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* quiz */
.prog{height:8px;background:var(--mist);border-radius:99px;overflow:hidden;margin:8px 0 18px}
.prog>i{display:block;height:100%;background:var(--teal)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.ctx{background:var(--mist);border-radius:10px;padding:12px 16px;margin:0 0 14px;font-size:17px}
.stem{font-size:19px;font-weight:500;margin:0 0 14px}
.listen{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.play{width:72px;height:72px;border-radius:50%;border:0;background:var(--teal);color:var(--on-teal);font-weight:700;font-size:18px}
.play:hover{background:var(--teal-d);color:#fff}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-size:14px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--coral);background:var(--coral-bg)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:12px 16px;border-radius:10px;background:var(--mist)}
.fb strong.ok{color:var(--ok)} .fb strong.bad{color:var(--coral)}
/* visuals */
.vis{margin:0 0 14px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.vis figcaption{font-weight:700;margin-bottom:8px}
.vis table{border-collapse:collapse;width:100%}
.vis th,.vis td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
.vis th{color:var(--muted);font-weight:500;font-size:14px}
.scroll{overflow-x:auto}
.bar{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;margin:6px 0}
.bar span.t{height:18px;background:var(--line);border-radius:4px;overflow:hidden}
.bar span.t i{display:block;height:100%;background:var(--teal)}
.bar em{font-style:normal;text-align:right}
.clock{display:block;width:150px;height:150px;margin:0 auto}
.clock circle{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.clock text{fill:var(--ink);font-size:9px;text-anchor:middle}
.clock line{stroke:var(--ink);stroke-linecap:round}
/* summary */
.dom{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.dom .t{height:14px;background:var(--line);border-radius:4px;overflow:hidden}
.dom .t i{display:block;height:100%;background:var(--teal)}
details{margin:12px 0;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
/* teacher list */
.item{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .n{font-weight:700;color:var(--muted)}
.item .pv{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:14px}
.mini:hover{border-color:var(--teal)}
/* sheet */
.sheet{background:#fff;color:#111;border:1.5px solid var(--line);border-radius:12px;padding:28px 30px;margin-top:10px;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
.sheet h2{color:#111;text-align:center;margin-bottom:6px}
.sheet .meta{text-align:center;color:#444;margin:0 0 20px;font-size:15px}
.sq{display:grid;grid-template-columns:30px 1fr;gap:6px;margin-bottom:20px;break-inside:avoid}
.sq .ctx{background:#F1F5F6;color:#111}
.sq .vis{background:#fff;color:#111;border-color:#bbb}
.sq .vis th{color:#555}.sq .bar span.t{background:#ddd}.sq .bar span.t i{background:#444}
.sq .clock circle{fill:#fff;stroke:#111}.sq .clock text{fill:#111}.sq .clock line{stroke:#111}
.sq .stem{font-size:16px}
.sq ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 14px}
.sq .say{font-style:italic;color:#444;margin:0 0 8px}
.key{border-top:2px dashed #999;margin-top:24px;padding-top:14px;font-size:15px}
.key h3{color:#111}
.key p{margin:6px 0}
textarea,select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}
details.panel{border:0}
details.panel>summary{font-family:"Noto Serif TC",serif;font-size:19px}
pre.tpl{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;overflow-x:auto}
.bp h3{font-size:16px;margin:16px 0 6px}
.bp table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
.bp th,.bp td{border-bottom:1px solid var(--line);padding:5px 10px;text-align:left}
.bp ul{margin:0;padding-left:20px;font-size:15px}
.bp p{font-size:15px;margin:8px 0}
.plain{margin:0 0 12px;padding-left:20px}.plain li{margin:4px 0}
.dx{grid-template-columns:minmax(150px,240px) 1fr 62px;align-items:center}
.dx .chip{text-align:left;border-radius:10px;padding:5px 12px;font-size:14px}
.lv{font-size:12px;font-weight:700}.lv.bad{color:var(--coral)}.lv.mid{color:var(--muted)}.lv.ok{color:var(--ok)}
.sub{font-size:14px;font-weight:700;color:var(--muted);margin:14px 0 8px}
.chip small{font-weight:400;opacity:.85}
.pimg{display:block;max-width:100%;max-height:120px;margin:2px auto}.opt .pimg{max-height:110px}
.simg{display:block;max-width:100%;max-height:220px;margin:0 auto 12px}
.sq .pimg{max-height:90px;display:inline-block;vertical-align:middle}.sq .simg{max-height:160px}
.picpanel{background:var(--mist);border-radius:10px;padding:12px;margin:2px 0 12px}
.thumb{width:72px;height:72px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px}
.bpick{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.bpick label{font-size:15px}
.iw{border-bottom:1px solid var(--line)}.iw .item{border-bottom:0}
footer{margin-top:40px;color:var(--muted);font-size:14px}
@media (max-width:560px){.dom{grid-template-columns:110px 1fr 48px}.sheet{padding:18px 14px}.item{grid-template-columns:26px 1fr}.item .acts{grid-column:2}}
/* 歷屆原題庫 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard.added{border-color:var(--ok)}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;font-weight:700}
.pc-chk{display:flex;gap:6px;align-items:center;cursor:pointer}
.pc-img{display:block;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px;cursor:zoom-in}
.pc-img.sm{width:120px;flex:none}
.pthumb{display:block;width:100%;max-height:190px;object-fit:contain;background:#fff}
.lthumb{display:block;width:100%;max-height:90px;object-fit:contain;background:#fff}
.ph{display:grid;place-items:center;min-height:80px;color:#777;font-size:13px;background:#f6f6f6}
.pc-meta{display:flex;flex-wrap:wrap;gap:4px}
.pc-ans{font-size:14px;color:var(--muted)}
.pc-ans b{color:var(--ink);font-size:16px}
.pc-acts{gap:6px;margin-top:auto}
.pc-txt{font-size:14px}.pc-txt p{margin:0 0 4px}
.olist{margin:0;padding-left:22px;font-size:14px}
.muted{color:var(--muted)}
.tag.lis{background:#E7EEFB;color:#2A4F8F;border-color:transparent}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--coral-bg);color:var(--coral);border-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.lis{background:#1E3352;color:#A9C6F5}}
:root[data-theme="dark"] .tag.lis{background:#1E3352;color:#A9C6F5}
.li{display:flex;gap:10px;align-items:flex-start;min-width:0}
.modal{position:fixed;inset:0;background:rgba(10,20,28,.55);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--bg);color:var(--ink);border-radius:14px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.zimg{display:block;max-width:100%;margin:6px auto 10px;background:#fff;border:1px solid var(--line);border-radius:8px}
.simg2{display:block;max-width:100%;max-height:420px;object-fit:contain;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:8px}
.srcbox{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px}
pre.script{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:15px;margin:6px 0}
.slot{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.oimg{display:block;max-width:100%;background:#fff}
.sheet .oimg{max-width:100%}
.sgrp{margin:6px 0 14px;break-inside:avoid}
.sgrp .gh{font-weight:700;margin:0 0 6px}
.lmark{display:inline-block;margin-top:4px;font-size:12px;border:1px solid #888;border-radius:4px;padding:0 4px;color:#444}
.sq ol.picopts{grid-template-columns:repeat(4,1fr)}
.pdesc{font-size:13px;color:#555}
@media (max-width:560px){.pgrid{grid-template-columns:1fr}.pc-img.sm{width:90px}.sq ol.picopts{grid-template-columns:repeat(2,1fr)}}

@media print{
  body *{visibility:hidden}
  #sheet,#sheet *{visibility:visible}
  #sheet{position:absolute;left:0;top:0;width:100%;border:0;padding:0;margin:0}
  #sheet .key{break-before:page}
  .modal{display:none}
  :root{padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>學力測驗題型複習命題</h1>
  <p class="lede">依 111～115 年縣市學力檢測英語科題本設計，涵蓋四到七年級。老師可以直接選用歷屆原題（含題本插圖），或請 Gemini 協助改編相似題，最後下載成 Word 複習卷。</p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-act="tab" data-mode="s" id="tab-s">學生練習</button>
    <button class="tab" role="tab" data-act="tab" data-mode="t" id="tab-t">教師命題</button>
    <button class="tab" role="tab" data-act="tab" data-mode="d" id="tab-d">學習診斷</button>
  </div>
  <main id="app"></main>
  <footer>歷屆題庫收錄 111～115 年縣市學生學習能力檢測英語科題本（四到七年級，缺 114 年五年級），題目圖片直接取自公開題本，答案為官方答案，並附試題疑義表的決議。聽力朗讀稿由錄音檔以語音辨識轉寫後整理，可能有少數誤差，請以原錄音為準。補充題由 Claude 依檢測弱項編寫；Gemini 改編的題目標有「改編」，正式使用前請老師核對答案與解析。</footer>
</div>

ife. \n○\nD He pays one thousand dollars for it.","ty":9,"tp":[9,16,0],"sc":"Woman: May I help you?\nMan: Yes. Can I try this sweater?\nWoman: What is your size?\nMan: Size 42.\nWoman: The sweater looks good on you.\nMan: Great. It's cool. How much is it?\nWoman: It is 1,200 dollars.\nMan: Here you are.\nWoman: Thanks.\nQuestion: What is true about the man?"},{"id":"113_G7_q15","k":"113_G7","y":113,"g":7,"n":15,"p":0,"a":0,"tx":"○\nA Kiki loves singing. \n○\nB Kiki is from Taipei. \n○\nC Kiki is a new teacher. \n○\nD Kiki plays basketball.","ty":9,"tp":[1,15],"sc":"Teacher: Good morning, class. We have a new student today.\nKiki: Hi, everyone. Nice to meet you. I am Kiki. I'm from Taitung. I love singing, but I don't like drawing. I play baseball every Sunday. I am very happy to join this class. Thank you.\nTeacher: Welcome, Kiki.\nQuestion: Which is true?"},{"id":"113_G7_q16","k":"113_G7","y":113,"g":7,"n":16,"p":1,"a":1,"tx":"Gina really helps her Mom. She always __________ her baby sister after school. \n○\nA looks up to \n○\nB takes care of \n○\nC breaks up with \n○\nD runs away from","ty":10,"tp":[0]},{"id":"113_G7_q17","k":"113_G7","y":113,"g":7,"n":17,"p":1,"a":1,"tx":"The poor woman on the street has nothing to eat and has no warm __________ to wear. \n○\nA bottles \n○\nB clothes \n○\nC houses \n○\nD water","ty":10,"tp":[2,8]},{"id":"113_G7_q18","k":"113_G7","y":113,"g":7,"n":18,"p":1,"a":2,"tx":"The phone comes in 2 colors. Which color do you like, blue or __________? \n○\nA apple \n○\nB lemon \n○\nC orange \n○\nD pear","ty":10,"tp":[4]},{"id":"113_G7_q19","k":"113_G7","y":113,"g":7,"n":19,"p":1,"a":0,"tx":"Mom: Why is there a cake on my desk? \nIan: It’s from me. I’d like to __________ you for all your help. \n○\nA thank \n○\nB think \n○\nC take \n○\nD tell","ty":10,"tp":[4,0]},{"id":"113_G7_q20","k":"113_G7","y":113,"g":7,"n":20,"p":1,"a":3,"tx":"Tim is crazy about K-pop songs. He listens to them every night, but his sister __________. \nShe hates them. \ ’s mother. \n○\nD Daniel’s classmate.","ty":9,"sc":"Woman: Hello. Is this Mr. Chen's house?\nMan: Yes. Who's calling?\nWoman: This is Patricia from Riverfront Elementary School. Your son, Daniel, is sick. Can you come and take him to see a doctor now?\nMan: No problem. Thank you for calling.\nQuestion: Who is Patricia?"},{"id":"115_G7_q13","k":"115_G7","y":115,"g":7,"n":13,"p":0,"a":3,"tx":"○\nA A cheese sandwich and soup. \n○\nB A ham sandwich and orange juice. \n○\nC A cheese sandwich and apple juice. \n○\nD A fruit sandwich, soup, and orange juice.","ty":9,"sc":"Woman: Hello. Here is the lunch menu.\nMan: Thanks. What is today's special?\nWoman: Today's special is tomato soup with a cheese sandwich.\nMan: Well, I don't like cheese.\nWoman: Oh, we also have ham and fruit sandwiches.\nMan: OK. I want a fruit sandwich and tomato soup, please.\nWoman: How about the drink?\nMan: Yes. Orange juice, please.\nQuestion: What does the man order?"},{"id":"115_G7_q14","k":"115_G7","y":115,"g":7,"n":14,"p":0,"a":3,"tx":"○\nA 2/4. \n○\nB 3/4. \n○\nC 2/14. \n○\nD 3/14.","ty":9,"sc":"Man: When is Cody's birthday?\nWoman: It is February 4th.\nMan: How about Mary's?\nWoman: March 14th.\nMan: Oh, my birthday is on that day, too.\nWoman: Really? Then let's have a birthday party together.\nQuestion: When is the man's birthday?"},{"id":"115_G7_q15","k":"115_G7","y":115,"g":7,"n":15,"p":0,"a":2,"tx":"○\nA Today is Saturday in Taiwan. \n○\nB The woman doesn’t have a phone. \n○\nC Jack’s baseball game is on Sunday. \n○\nD The man’s time and date are wrong.","ty":9,"sc":"Man: Nancy, it is time for Jack's baseball game.\nWoman: No, it is on Sunday.\nMan: Today is Sunday.\nWoman: No, today is Saturday.\nMan: Look at my phone. Today is Sunday.\nWoman: Oh no, the time and date on my phone are the US time, not Taiwan time.\nQuestion: Which is true?"},{"id":"115_G7_q16","k":"115_G7","y":115,"g":7,"n":16,"p":1,"a":3,"tx":"Look at the picture. Where is the clock? \n \n○\nA On the desk. \n○\nB Under the bed. \n○\nC In front of the cat. \n○\nD Next to the painting.","ty":4},{"id":"115_G7_q17","k":"115_G7","y":115,"g":7,"n":17,"p":1,"a":2,"tx":"The blue car runs the race in __________ place, right after the red car.  \n○\nA first  \n○\nB large  \n○\nC second \n○\nD small","ty":10},{"id":"115_G7_q18","k":"115_G7","y":115,"g":7,"n":18,"p":1,"a":2,"tx":"Sam: Mom, your phone is ringing. \nMom: Sam, can you __________ my phone. I’m cooking now. \n○\nA ring \n○\nB call \n○\nC check \n○\nD reach","ty":10},{"id":"115_G7_q19","k":"115_G7","y":115,"g":7,"n":19,"p":1,"a":1,"tx":"Abby: Nick, __________ kind to your brother. He’s just two years old. \nNick: Okay.  \n○\nA am \n○\nB be \n○\nC do \n○\nD is","ty":10},{"id":"115_G7_q20","k":"115_G7","y":115,"g":7,"n":20,"p":1,"a":0,"tx":"A: How often do you clean your bedroom?  \nB: I clean my bedroom __________.   \n○\nA every two days \n○\nB three times \n○\nC in the evening \n○\nD for one hour","ty":10},{"id":"115_G7_q21","k":"115_G7","y":115,"g":7,"n":21,"p":1,"a":0,"tx":"Joe: Does your son like exercise?   \nZoe: __________. He likes playing games on his cellphone. \n○\nA Well, he doesn’t. \n○\nB No, he always does. \n○\nC Yes, he likes games. \n○\nD Yes, he likes playing.","ty":10},{"id":"115_G7_q22","k":"115_G7","y":115,"g":7,"n":22,"p":1,"a":1,"tx":"Fengchia Night Market is famous for __________ delicious food, such as hot dogs and tea \neggs.  \n○\nA it \n○\nB its \n○\nC it’s \n○\nD they’re","ty":10},{"id":"115_G7_q23","k":"115_G7","y":115,"g":7,"n":23,"p":1,"a":3,"tx":"Denny: My aunt is so behind the times! \nNick: What do you mean? She often wears a black hat, and she is very cool. \nDenny: She doesn’t use cellphones and LINE. She writes letters to us every month. \n \nWhat does behind the times mean? \n○\nA She likes cellphones. \n○\nB She learns new ideas. \n○\nC She has cool black hats. \n○\nD She lives in an old way.","ty":4},{"id":"115_G7_q24","k":"115_G7","y":115,"g":7,"n":24,"p":1,"a":2,"tx":"○\nA Three students play sports after school  \n○\nB Four students watch TV after school  \n○\nC Four students play sports after school  \n○\nD Twenty students play sports after school","grp":"24-26","ty":6},{"id":"115_G7_q25","k":"115_G7","y":115,"g":7,"n":25,"p":1,"a":3,"tx":"○\nA do homework on their phones  \n○\nB read comic books in their free time  \n○\nC ride bikes with friends in their free time  \n○\nD play games on their phones in their free time","grp":"24-26","ty":6},{"id":"115_G7_q26","k":"115_G7","y":115,"g":7,"n":26,"p":1,"a":2,"tx":"○\nA with no games in their free time \n○\nB only with sports to play after school \n○\nC with many fun and healthy things to do  \n○\nD with lots of homework to do every day","grp":"24-26","ty":6},{"id":"115_G7_q27","k":"115_G7","y":115,"g":7,"n":27,"p":1,"a":2,"tx":"Which picture is Lisa’s family tree? \n○\nA \n \n○\nB \n \n○\nC \n \n○\nD","grp":"27-28","ty":6},{"id":"115_G7_q28","k":"115_G7","y":115,"g":7,"n":28,"p":1,"a":1,"tx":"Who may write this message? \nHoney, after 3 months at sea, my brother can come back on \nChinese New Year’s Eve. Can you make a pizza for him on \nthat day? He misses pizza so much.  \n○\nA Jack \n○\nB Jean \n○\nC John \n○\nD Lisa","grp":"27-28","ty":6},{"id":"115_G7_q29","k":"115_G7","y":115,"g":7,"n":29,"p":1,"a":3,"tx":"Does Bruce join the sports team at school? \n○\nA Yes, he does. He cares much about sports.   \n○\nB Yes, he does. And he likes hard math problems. \n○\nC No, he doesn’t. He is too busy with group work.   \n○\nD No, he doesn’t. His legs are not strong enough to run.","grp":"29-32","ty":6},{"id":"115_G7_q30","k":"115_G7","y":115,"g":7,"n":30,"p":1,"a":0,"tx":"Look at the pictures. What is a ramp? \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n○\nA \n○\nB \n○\nC \n \n○\nD","grp":"29-32","ty":6},{"id":"115_G7_q31","k":"115_G7","y":115,"g":7,"n":31,"p":1,"a":2,"tx":"What does Bruce do in group work? \n○\nA He carries all the books. \n○\nB He does all the group work. \n○\nC He makes plans for his team.   \n○\nD He does his math homework.","grp":"29-32","ty":6},{"id":"115_G7_q32","k":"115_G7","y":115,"g":7,"n":32,"p":1,"a":3,"tx":"What is the main idea of the story? \n○\nA Bruce is different from others.  \n○\nB Bruce needs help all the time. \n○\nC Only strong students can be group leaders. \n○\nD Everyone is special and can do great things.","grp":"29-32","ty":6},{"id":"115_G7_q33","k":"115_G7","y":115,"g":7,"n":33,"p":1,"a":3,"tx":"It is Sunday afternoon. What is Tina doing?                               \n○\nA Eating lunch.  \n○\nB Watching TV.  \n○\nC Playing with Kitty. \n○\nD Cleaning the bedroom.","grp":"33-35","ty":6},{"id":"115_G7_q34","k":"115_G7","y":115,"g":7,"n":34,"p":1,"a":2,"tx":"It’s Friday night. Who is with Tina? \n○\nA Gigi.  \n○\nB Cherry. \n○\nC Her parents. \n○\nD Her grandma.","grp":"33-35","ty":6},{"id":"115_G7_q35","k":"115_G7","y":115,"g":7,"n":35,"p":1,"a":0,"tx":"What day is Christmas? \n○\nA This Saturday.  \n○\nB This Sunday. \n○\nC This Tuesday.  \n○\nD This Friday.","grp":"33-35","ty":6}];

<script>
const D = {ph:'語音聽辨', fe:'文化節慶理解', rd:'句子與圖表整合閱讀', ot:'其他（自訂主題）'};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- 題庫 ---------- */

const MOOD = {t:'bar', title:'Class Mood Survey (24 students)', data:[['Happy',12],['Tired',6],['Nervous',4],['Angry',2]]};

const SCHED = {t:'table', title:'School Schedule', head:['Time','Class'], rows:[['8:30','Music'],['9:20','English'],['10:10','Recess'],['10:30','Math']]};
const DIARY = 'June 14. Today is Dragon Boat Festival. In the morning, I helped Grandma make zongzi. In the afternoon, we watched the boat races. I was tired but very happy.';
const L = '聽音，選出你聽到的單字。';
const BASE = [
 // 語音聽辨
 {id:'ph1',d:'ph',say:'wave',stem:L,options:['were','wife','wove','wave'],a:3,ex:'wave 的母音是長音 /eɪ/；wife 是 /aɪ/，wove 是 /oʊ/，were 是 /ɜr/。'},
 {id:'ph2',d:'ph',say:'sheep',stem:L,options:['ship','sheep','shop','shape'],a:1,ex:'sheep 的 ee 發長音 /iː/；ship 是短音 /ɪ/。'},
 {id:'ph3',d:'ph',say:'bed',stem:L,options:['bad','bed','bid','bud'],a:1,ex:'bed 的母音是 /ɛ/，注意與 bad /æ/、bid /ɪ/、bud /ʌ/ 的差異。'},
 {id:'ph4',d:'ph',say:'cab',stem:L,options:['cap','cab','cat','can'],a:1,ex:'關鍵在字尾輔音：cab 結尾是有聲的 /b/，cap 結尾是無聲的 /p/。'},
 {id:'ph5',d:'ph',say:'think',stem:L,options:['sink','think','thick','thing'],a:1,ex:'think 開頭是咬舌音 /θ/，sink 開頭是 /s/；thick、thing 的字尾也不同。'},
 {id:'ph6',d:'ph',say:'rice',stem:L,options:['lice','rice','nice','mice'],a:1,ex:'rice 開頭是捲舌的 /r/，lice 開頭是 /l/（舌尖頂上顎）。'},
 {id:'ph7',d:'ph',say:'van',stem:L,options:['ban','van','fan','pan'],a:1,ex:'van 開頭是有聲的 /v/（上齒碰下唇並震動聲帶），fan 是無聲的 /f/。'},
 {id:'ph8',d:'ph',say:'light',stem:L,options:['right','light','night','like'],a:1,ex:'light 開頭是 /l/；right 是 /r/；night 是 /n/；like 的字尾是 /k/。'},
 {id:'ph9',d:'ph',stem:'哪一個字的母音發音和 cake 相同？',options:['cat','rain','sit','hot'],a:1,ex:'cake 的 a_e 發長音 /eɪ/，rain 的 ai 也發 /eɪ/。'},
 {id:'ph10',d:'ph',stem:'哪一個字和 light 押韻（結尾發音相同）？',options:['late','night','lit','little'],a:1,ex:'light 與 night 結尾都是 /aɪt/。'},
 {id:'ph11',d:'ph',stem:'哪一個字的開頭發音和 phone 相同？',options:['pen','fish','hope','bone'],a:1,ex:'ph 發 /f/，與 fish 的開頭相同。'},
 {id:'ph12',d:'ph',stem:'哪一個字含有不發音的字母？',options:['knife','kite','king','kid'],a:0,ex:'knife 的 k 不發音，念作 /naɪf/。'},
 {id:'ph13',d:'ph',stem:'哪一個字的 i 發長音 /aɪ/？',options:['fish','kite','sit','milk'],a:1,ex:'kite 符合 i_e 規則：結尾的 e 不發音，i 唸長音 /aɪ/。'},
 // 文化節慶
 {id:'fe1',d:'fe',stem:'"Trick or treat!" is said on which holiday?',options:['Christmas','Halloween','Dragon Boat Festival',"Valentine's Day"],a:1,ex:'萬聖節（Halloween）時，孩子們會說 Trick or treat! 向大家要糖果。'},
 {id:'fe2',d:'fe',stem:'We eat moon cakes at the ______ Festival.',options:['Dragon Boat','Mid-Autumn','Lantern','Spring'],a:1,ex:'月餅（moon cake）是中秋節（Mid-Autumn Festival）的應景食物。'},
 {id:'fe3',d:'fe',stem:'What do people eat on Dragon Boat Festival?',options:['Rice dumplings','Turkey','Pumpkin pie','Moon cakes'],a:0,ex:'端午節吃粽子，英文可說 rice dumplings 或 zongzi。'},
 {id:'fe4',d:'fe',stem:'On Christmas morning, Tom finds presents under the ______.',options:['bed','Christmas tree','table','moon'],a:1,ex:'聖誕節的禮物通常放在聖誕樹（Christmas tree）下。'},
 {id:'fe5',d:'fe',ctx:'A: Trick or treat!',stem:'B: ______',options:['Happy New Year!','Here is some candy.','Merry Christmas!','Happy birthday!'],a:1,ex:'被說 Trick or treat! 時，要回應並給對方糖果。'},
 {id:'fe6',d:'fe',stem:'Children get red envelopes at Chinese New Year. What is inside?',options:['Lucky money','Candy canes','Pumpkins','Rice dumplings'],a:0,ex:'紅包裡面是壓歲錢，英文是 lucky money。'},
 {id:'fe7',d:'fe',stem:'聖誕節當天，你會對朋友說什麼？',options:['Merry Christmas!','Happy Halloween!',"Happy Mother's Day!",'Good night!'],a:0,ex:'聖誕節的祝福語是 Merry Christmas!'},
 {id:'fe8',d:'fe',ctx:"Jenny's family is making zongzi. Grandma teaches her how to wrap them. Tomorrow they will watch boat races by the river.",stem:'What festival is it?',options:['Christmas','Halloween','Dragon Boat Festival','Mid-Autumn Festival'],a:2,ex:'粽子（zongzi）與划龍舟（boat races）都是端午節的重點。'},
 {id:'fe9',d:'fe',ctx:'HALLOWEEN NEWS\nMany children wear costumes tonight. Some dress up as ghosts and witches. They go from house to house and get candy.',stem:'What do the children do tonight?',options:['They give red envelopes.','They wear costumes and get candy.','They eat moon cakes.','They race boats.'],a:1,ex:'短文說孩子們穿上服裝（wear costumes），挨家挨戶要糖果（get candy）。'},
 {id:'fe10',d:'fe',stem:'What do people eat at the Lantern Festival?',options:['Tangyuan','Zongzi','Pumpkin pie','Hot dogs'],a:0,ex:'元宵節吃湯圓（tangyuan），並且賞花燈。'},
 {id:'fe11',d:'fe',stem:'On Mid-Autumn Festival night, many families ______ and look at the full moon.',options:['have a barbecue','go swimming','wear costumes','open presents'],a:0,ex:'台灣中秋節常見的習俗是烤肉（have a barbecue）、賞月。'},
 {id:'fe12',d:'fe',ctx:'Dear Amy,\nMerry Christmas! Thank you for the gift. I love the red scarf.\nLove, Ben',stem:'Why does Ben write to Amy?',options:['To say sorry','To say thank you','To say goodbye','To ask for help'],a:1,ex:'Ben 說 Thank you for the gift，所以是要道謝。'},
 // 句子與圖表整合
 {id:'rd1',d:'rd',vis:TZ,stem:'It is 3:00 PM in Taipei. What time is it in London?',options:['3:00 AM','8:00 AM','5:00 PM','8:00 PM'],a:1,ex:'從表格中找到 London，對應的時間是 8:00 AM。'},
 {id:'rd2',d:'rd',vis:TZ,ctx:'Mia lives in New York.',stem:'Look at the World Clock. What is Mia probably doing now?',options:['Sleeping','Eating lunch','Going to school','Playing baseball'],a:0,ex:'New York 現在是 3:00 AM（凌晨），Mia 很可能正在睡覺。'},
 {id:'rd3',d:'rd',vis:MOOD,stem:'How many students are tired or nervous?',options:['6','10','12','16'],a:1,ex:'Tired 有 6 人，Nervous 有 4 人，6 + 4 = 10。'},
 {id:'rd4',d:'rd',vis:MOOD,stem:'Which mood has the fewest students?',options:['Happy','Tired','Nervous','Angry'],a:3,ex:'Angry 只有 2 人，是最少的。'},
 {id:'rd5',d:'rd',vis:MOOD,stem:'How many students answered the survey?',options:['12','18','24','30'],a:2,ex:'12 + 6 + 4 + 2 = 24，標題也寫著 24 students。'},
 {id:'rd6',d:'rd',vis:WEATHER,stem:'Amy should take an umbrella on which days?',options:['Monday and Tuesday','Tuesday and Wednesday','Wednesday and Thursday','Thursday and Friday'],a:2,ex:'Wed 與 Thu 的天氣是 Rainy（下雨），要帶傘。'},
 {id:'rd7',d:'rd',vis:WEATHER,stem:'Which day is the hottest?',options:['Monday','Wednesday','Thursday','Friday'],a:0,ex:'Monday 是 28°C，是一週中最高溫。'},
 {id:'rd8',d:'rd',vis:SCHED,stem:'What class comes right after English?',options:['Music','Recess','Math','Lunch'],a:1,ex:'English 9:20 之後是 10:10 的 Recess（下課）。'},
 {id:'rd9',d:'rd',vis:SCHED,stem:'What time does Math class start?',options:['9:20','10:10','10:30','11:00'],a:2,ex:'表格中 Math 對應 10:30。'},
 {id:'rd10',d:'rd',vis:{t:'clock',h:4,m:45},stem:'What time is it?',options:['4:15','4:45','5:15','5:45'],a:1,ex:'長針指向 9（45 分），短針接近 5，所以是 4:45（a quarter to five）。'},
 {id:'rd11',d:'rd',ctx:'Although it was raining, Ben rode his bike to school.',stem:'What do we know about Ben?',options:['He walked to school.','He rode his bike in the rain.','He stayed at home.','The weather was sunny.'],a:1,ex:'Although 表示「雖然」：雖然下雨，Ben 還是騎腳踏車上學。'},
 {id:'rd12',d:'rd',ctx:'Before Lily goes to bed, she brushes her teeth and reads a book.',stem:'What does Lily do before bed?',options:['She watches TV and eats dinner.','She brushes her teeth and reads.','She plays outside.','She does homework only.'],a:1,ex:'Before 後面接的動作發生在前：刷牙（brushes her teeth）和看書（reads a book）。'},
 {id:'rd13',d:'rd',ctx:DIARY,stem:'What did the writer do in the morning?',options:['Watched boat races','Helped Grandma make zongzi','Went to school','Played basketball'],a:1,ex:'日記寫 In the morning, I helped Grandma make zongzi。'},
 {id:'rd14',d:'rd',ctx:DIARY,stem:'How did the writer feel at the end of the day?',options:['Angry and sad','Tired but happy','Nervous','Bored'],a:1,ex:'最後一句 I was tired but very happy。'},
 {id:'rd15',d:'rd',ctx:'Tom is taller than Sam, but Sam is faster than Tom.',stem:'Who is faster?',options:['Tom','Sam','Both',"We don't know"],a:1,ex:'Sam is faster than Tom：Sam 跑得比較快；taller 說的是身高。'},

function parseTable(t){
  t = t.replace(/^\uFEFF/, '');
  const first = t.split(/\r?\n/)[0] || '';
  const delim = first.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i+1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }

}

async function buildSet(cfg, exclude){
  const notes = [], ds = [...cfg.ds], used = new Set(exclude || []);
  if (!ds.length) return {qs:[], notes:['請至少選一個範圍。']};
  const alloc = {}; ds.forEach(d => alloc[d] = 0);
  for (let i = 0; i < cfg.n; i++) alloc[ds[i % ds.length]]++;
  const qs = [], need = {};
  for (const d of ds) {
    const n = alloc[d]; if (!n) continue;
    const avail = shuffle(BANK.filter(q => q.d === d && !used.has(q.id) && fit(q, cfg) && (!cfg.types || !cfg.types.size || cfg.types.has(typeOf(q)))));
    if (cfg.focus) { const f = cfg.focus; const sc = q => topicsOf(q).filter(t => f.topics.includes(t)).length * 2 + (q.d === 'ph' && f.domains.includes('ph') ? 2 : 0) + ((f.types || []).includes(typeOf(q)) ? 2 : 0); avail.sort((a, b) => sc(b) - sc(a)); }
    let nb, na;
    if (d === 'ot' && cfg.src !== 'bank') { nb = 0; na = n; }
    else if (cfg.src === 'bank') { nb = Math.min(n, avail.length); na = 0; if (nb < n) notes.push(nb === 0 ? `題庫中沒有符合「${cfg.grade} 年級${cfg.ver !== '通用' ? '、' + cfg.ver + '版' : ''}」的「${D[d]}」題目。可改用 AI 產生，或到「我的題庫」上傳題目。${cfg.types && cfg.types.size ? '（已限定題型：' + [...cfg.types].join('、') + '）' : ''}` : `題庫中符合條件的「${D[d]}」只剩 ${nb} 題可用。`); }
    else if (cfg.src === 'ai') { nb = 0; na = n; }
    else { na = Math.ceil(n / 2); nb = Math.min(n - na, avail.length); na = n - nb; }
    avail.slice(0, nb).forEach(q => { qs.push(clone(q)); used.add(q.id); });
    if (na) need[d] = na;
  }
  if (cfg.src !== 'ai') {
    const short = cfg.n - qs.length - Object.values(need).reduce((a, b) => a + b, 0);
    if (short > 0) {
      const more = shuffle(BANK.filter(q => ds.includes(q.d) && !used.has(q.id) && fit(q, cfg) && (!cfg.types || !cfg.types.size || cfg.types.has(typeOf(q))))).slice(0, short);
      more.forEach(q => { qs.push(clone(q)); used.add(q.id); });
      if (more.length) notes.push('部分範圍的題庫題數不足，已用其他範圍的題目補足。');
    }
  }
  if (Object.keys(need).length) {
    try {
      const ai = await aiGen(need, cfg.topic, cfg);
      qs.push(...ai);
      const got = {}; ai.forEach(q => got[q.d] = (got[q.d]||0)+1);
      for (const d in need) if ((got[d]||0) < need[d]) notes.push(`AI 只產生了「${D[d]}」${got[d]||0} 題（需要 ${need[d]} 題）。`);
    } catch (e) {
      const m = aiErr(e); if (m) notes.push(m);
      if (e && e.code === 'cancelled') throw e;
      for (const d in need) {
        const more = shuffle(BANK.filter(q => q.d === d && !used.has(q.id) && fit(q, cfg) && (!cfg.types || !cfg.types.size || cfg.types.has(typeOf(q))))).slice(0, need[d]);
        more.forEach(q => { qs.push(clone(q)); used.add(q.id); });
      }
    }
  }
  return {qs, notes};
}

  }
  if (v.t === 'bar') {
    const max = Math.max(...v.data.map(d=>d[1]), 1);
    return `<figure class="vis"><figcaption>${esc(v.title)}</figcaption>${v.data.map(d=>`<div class="bar"><span>${esc(d[0])}</span><span class="t"><i style="width:${(d[1]/max*100).toFixed(1)}%"></i></span><em>${esc(d[1])}</em></div>`).join('')}</figure>`;
  }
  if (v.t === 'clock') {
    const ha = ((v.h % 12) + v.m / 60) * 30, ma = v.m * 6;
    let nums = '';
    for (let k = 1; k <= 12; k++) { const x = 50 + 38 * Math.sin(k * Math.PI / 6), y = 50 - 38 * Math.cos(k * Math.PI / 6) + 3.2; nums += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}">${k}</text>`; }
    return `<figure class="vis"><svg class="clock" viewBox="0 0 100 100" role="img" aria-label="時鐘圖"><circle cx="50" cy="50" r="47"/>${nums}<line x1="50" y1="50" x2="50" y2="27" stroke-width="3.4" transform="rotate(${ha} 50 50)"/><line x1="50" y1="50" x2="50" y2="15" stroke-width="2" transform="rotate(${ma} 50 50)"/><circle cx="50" cy="50" r="2.4" style="fill:var(--ink);stroke:none"/></svg></figure>`;
  }
  return '';
}
function visText(v){
  if (!v) return '';
  if (v.t === 'table') return `[${v.title}]\n` + [v.head, ...v.rows].map(r => '  ' + r.join(' | ')).join('\n') + '\n';
  if (v.t === 'bar') return `[${v.title}]\n` + v.data.map(d => `  ${d[0]}: ${d[1]}`).join('\n') + '\n';
  if (v.t === 'clock') return '[時鐘圖：請使用列印版查看]\n';
  return '';
}

const hasTTS = 'speechSynthesis' in window;
function speak(text, rate){
  if (!hasTTS) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => /^en[-_]US/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---------- 題目呈現 ---------- */
function qBody(q, opts, mode){
  if (q.past) return pastBody(q, opts);
  const m = mode || 'text', phon = isPhon(q);
  const showScript = q.say && !phon && (m === 'text' || m === 'both' || opts === 'review');
  const showAudio = q.say && opts === 'listen' && (phon || m === 'audio' || m === 'both');
  const listen = showAudio ? (hasTTS
    ? `<div class="listen"><button class="play" data-act="play" data-r="0.85" aria-label="播放發音">聽</button><button class="btn ghost" data-act="play" data-r="0.55">慢速播放</button><span class="hint">可以重複播放。</span></div>`
    : `<p class="notice">這台裝置不支援語音播放，請請老師朗讀。</p>`) : '';
  const script = showScript ? `<p class="ctx"><b>聽力文字稿</b><br>${nl(q.say)}</p>` : '';
  const stem = showScript && !showAudio ? String(q.stem).replace(/^聽音，/, '閱讀文字稿，') : q.stem;
  return `${q.ctx ? `<p class="ctx">${nl(q.ctx)}</p>` : ''}${script}${visHTML(q.vis)}${stemImg(q)}<p class="stem">${nl(stem)}</p>${listen}`;
}

async function startQuiz(){
  S.view = 'loading'; S.msg = []; render();
  try {
    const r = S.cfg.src === 'past' ? pastSet(S.cfg) : await buildSet(S.cfg);
    if (!r.qs.length) { S.view = 'setup'; S.msg = r.notes.length ? r.notes : ['沒有可用的題目，請調整範圍或來源。']; return render(); }
    S.Q = {qs:shuffle(r.qs), i:0, picks:[]}; S.view = 'quiz'; S.msg = r.notes;
  } catch (e) { S.view = 'setup'; S.msg = []; }
  render();
}

  <h3>語音聽辨：聽音選字，選項只差一個音</h3>
  <ul><li>111：tall/wall/ball/doll；white/write/ride/right；tore/Thor/door/Dior；phase/chase/shoes/fare；crusts/classes/gloves/glasses</li>
  <li>112：字母 p/t/b/d；bathroom/bedroom/balloon/bamboo；zebro/zedra/zero/zebra</li>

  <li>114：cheer/there/share/where；drink/Derek/trick/truck</li></ul>
  <p>規律：首音、母音、字尾輔音的差異，加上 ph/wh/ch/sh/th、dr/tr 等組合；數字要分辨 13/30、18/80、nine/ninety。</p>
  <h3>每年都考的主題</h3>
  <ul><li><b>節慶</b>：五年級每年約 3～8 題（111 年 8 題，114 年 4 題）；六年級平均約 2.6 題，七年級幾乎沒有；整體近年有下降趨勢。聖誕、萬聖、春節（年夜飯、紅包）、元宵、中秋（月餅、柚子、烤肉）、端午（粽子、立蛋、划龍舟）、母親節、教師節、雙十節。</li>
  <li><b>時間與行程</b>：時鐘、作息、課表、日曆、圖書館與美術館的開放時間。</li>
  <li><b>數字與金額</b>：收據、價目表、票價、年齡、長度（113 cm）、百位數。</li>
  <li><b>地點與方向</b>：地圖、行程圖、郵局／銀行／超市／圖書館。</li>
  <li><b>天氣、情緒與健康、服裝、家人與職業、學科、食物購物</b>：幾乎每年都有。</li></ul>
  <h3>閱讀題型與趨勢</h3>
  <ul><li>字母辨識只在 111 年出現，112 年起取消。</li>
  <li>題型從「看圖配單字」逐漸增加為「看真實文件回答 Which is true?」：收據、票價表、車票、聊天訊息、緊急聯絡卡、行程圖。</li>
  <li>最後 5 題固定是兩組篇章（2 題＋3 題，或 3 題＋2 題）。</li>
  <li>干擾選項的手法：相近數字或字（thirteen/thirty、seven/seventeen）、錯誤的星期或日期、把其他節日的習俗混進來。</li></ul>

  <h3>各年級概況（111～115 年）</h3>

  <li><b>六年級</b>：聽力 15 題、閱讀 20 題（111 年含 2 題字母辨識）。情境句配圖、生活問答（Where/What/How…）、節慶、天氣與價格；後段是書信、日記、行程與網路評論。干擾選項常混淆人稱（I/he/she）與疑問詞。</li>

  <li>四年級閱讀第 16–17 題仍是字母辨識（rhinoceros、dodgers）。</li>
  <li>115 年六年級試題疑義表：第 5 題（I have a runny nose.）圖片易與垃圾桶圖混淆、第 24 題地圖上臺南的箭頭指錯，兩題都維持原答案。命題提醒：圖片選項要避免模稜兩可，並檢查圖表標示是否正確。</li></ul>

async function tGen(){

  try { const r = await buildSet(T.cfg); T.list = r.qs; T.msg = r.notes.length || r.qs.length ? r.notes : ['沒有可用的題目，請調整範圍或來源。']; }
  catch (e) {}
  T.loading = false; render();
}
async function tAdd(){
  T.loading = true; T.msg = []; render();
  try { const r = await buildSet(Object.assign({}, T.cfg, {n:3}), T.list.map(q=>q.id)); T.list.push(...r.qs); T.msg = r.notes; }
  catch (e) {}
  T.loading = false; render();
}
async function tRep(i){
  const q = T.list[i]; T.busy = i; T.msg = []; render();
  const used = new Set(T.list.map(x => x.id)); let nq = null;
  if ((q.d !== 'ot' || T.cfg.src === 'bank') && T.cfg.src !== 'ai') { const c = BANK.filter(b => b.d === q.d && !used.has(b.id) && fit(b, T.cfg) && (!T.cfg.types.size || T.cfg.types.has(typeOf(b)))); if (c.length) nq = clone(c[Math.floor(Math.random()*c.length)]); }
  if (!nq && T.cfg.src !== 'bank') {
    try { nq = (await aiGen({[q.d]:1}, T.cfg.topic, T.cfg))[0]; } catch (e) { const m = aiErr(e); if (m) T.msg = [m]; }
  }
  if (nq) T.list[i] = nq; else if (!T.msg.length) T.msg = ['這個範圍沒有可替換的題目了。'];
  T.busy = null; render();
}
function textSheet(){
  let t = `${T.title}\n班級：＿＿＿＿　座號：＿＿　姓名：＿＿＿＿＿＿　日期：＿＿＿＿\n\n`;
  T.list.forEach((q,i) => {
    t += `${i+1}. ${q.say && (isPhon(q) || T.cfg.listen === 'audio') ? '（聽力題：由老師朗讀）' : ''}\n`;
    if (q.say && !isPhon(q) && T.cfg.listen !== 'audio') t += '【聽力文字稿】' + q.say + '\n';
    if (q.ctx) t += q.ctx + '\n';
    t += visText(q.vis);
    t += sheetStem(q) + '\n' + q.options.map((o,j) => `   (${LET[j]}) ${hasOptPics(q) && picOf(q, j) ? '（圖片，請用列印版）' : o}`).join('\n') + '\n\n';
  });
  if (T.key) {
    t += '==== 答案與解析 ====\n' + T.list.map((q,i) => `${i+1}. ${LET[q.a]}　${q.ex}`).join('\n') + '\n';
    const sc = T.list.map((q,i) => needsRead(q) ? `第 ${i+1} 題：${q.say}（請念兩遍）` : '').filter(Boolean);
    if (sc.length) t += '\n==== 聽力朗讀稿 ====\n' + sc.join('\n') + '\n';
  }
  return t;
}

function fileToDataURL(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const sc = Math.min(1, 520 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.88)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ---------- 學習扶助測驗結果（O／△／X） ---------- */
function parseStatus(x){ const v = String(x ?? '').trim(); if (/^[Oo○Ｏ]$/.test(v)) return 1; if (/^[△▲Δ]$/.test(v)) return 0.5; if (/^[XxＸ×✕]$/.test(v)) return 0; return null; }
function parseReport(text){
  const clean = text.split(/\r?\n/).filter(l => !/學校名稱|身分證|身份證|學生姓名|姓名|班級名稱/.test(l)).join('\n');
  const num = rx => { const m = clean.match(rx); return m ? Number(m[1]) : null; };
  const items = {}; let m;
  const rx = /(?:^|\n)\s*(\d{1,2})[\s\t]+([\u4e00-\u9fffA-Za-z]+_[\u4e00-\u9fffA-Za-z]+)[\s\t]+([OＯ○△▲ΔXＸ×✕])/g;
  while ((m = rx.exec(clean))) items[m[2]] = parseStatus(m[3]);
  return {score:num(/評量成績[^\d]{0,12}(\d+(?:\.\d+)?)/), th:num(/通過標準[^\d]{0,12}(\d+(?:\.\d+)?)/), items};
}
function dxAddC(text){
  DX.msg = ''; DX.info = '';
  const t = String(text || '').trim();
  if (!t) { DX.msg = '請先貼上或上傳資料。'; return render(); }
  if (/(^|[^A-Za-z0-9])[A-Za-z][12]\d{8}(?!\d)/.test(t) || /09\d{2}-?\d{3}-?\d{3}/.test(t)) { DX.msg = '資料中發現疑似身分證字號或電話。請先移除這些內容再貼上。'; DX.paste = ''; return render(); }
  const isTable = /^(代號|編號|code|id)/i.test(t.split(/\r?\n/)[0].trim());

function parseClassRows(text){

    tbl.slice(1).forEach(r => { const nm = String(r[nc] ?? '').trim(), o = Number(r[io]), p = Number(r[ip]), x = Number(r[ix]); if (nm && [o, p, x].every(v => Number.isInteger(v) && v >= 0)) rows.push({name:nm, o, p, x}); });
    return rows;
  }

    const cells = (line.includes('\t') ? line.split('\t') : line.trim().split(/\s+/)).map(c => c.trim()).filter(Boolean);

function b64bytes(u){ const b = atob(u.split(',')[1]), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function imgLoad(u){ return new Promise(res => { const im = new Image(), t = setTimeout(() => res(null), 2500); im.onload = () => { clearTimeout(t); res(im); }; im.onerror = () => { clearTimeout(t); res(null); }; im.src = u; }); }
async function dataImg(u, maxW){
  const im = await imgLoad(u);
  if (!im) return {bytes:b64bytes(u), w:maxW, h:maxW};
  const nw = im.naturalWidth, nh = im.naturalHeight, sc = Math.min(1, maxW / nw);
  const cv = document.createElement('canvas'); cv.width = nw; cv.height = nh; const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, nw, nh); g.drawImage(im, 0, 0);
  return {bytes:b64bytes(cv.toDataURL('image/png')), w:Math.max(20, Math.round(nw * sc)), h:Math.max(20, Math.round(nh * sc))};
}
function canvasImg(w, h, draw){ const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); draw(g); return {bytes:b64bytes(cv.toDataURL('image/png')), w:Math.round(w / 2), h:Math.round(h / 2)}; }
function barImage(v){
  const rows = v.data, max = Math.max(...rows.map(r => r[1]), 1), W = 760, H = 70 + rows.length * 48;
  return canvasImg(W, H, g => { g.fillStyle = '#000'; g.font = 'bold 26px sans-serif'; g.fillText(v.title || '', 16, 38); g.font = '24px sans-serif'; rows.forEach((r, i) => { const y = 70 + i * 48; g.fillStyle = '#000'; g.fillText(String(r[0]), 16, y + 24); g.fillStyle = '#555'; g.fillRect(190, y + 4, Math.max(4, (W - 290) * r[1] / max), 28); g.fillStyle = '#000'; g.fillText(String(r[1]), 200 + (W - 290) * r[1] / max, y + 26); }); });
}
function clockImage(v){
  return canvasImg(300, 300, g => {
    g.strokeStyle = '#000'; g.lineWidth = 4; g.beginPath(); g.arc(150, 150, 140, 0, 7); g.stroke();
    g.fillStyle = '#000'; g.font = '22px sans-serif'; g.textAlign = 'center';
    for (let k = 1; k <= 12; k++) g.fillText(String(k), 150 + 112 * Math.sin(k * Math.PI / 6), 150 - 112 * Math.cos(k * Math.PI / 6) + 8);
    const hand = (ang, len, lw) => { g.lineWidth = lw; g.lineCap = 'round'; g.beginPath(); g.moveTo(150, 150); g.lineTo(150 + len * Math.sin(ang), 150 - len * Math.cos(ang)); g.stroke(); };
    hand(((v.h % 12) + v.m / 60) * Math.PI / 6, 70, 8); hand(v.m * Math.PI / 30, 105, 5);
  });
}
async function buildDocModel(){
  const qs = [];
  for (const [i, q] of T.list.entries()) {
    const m = {n:i + 1, stem:sheetStem(q), ctx:q.ctx || '', script:(q.say && !isPhon(q) && T.cfg.listen !== 'audio') ? q.say : '', audioNote:!!q.say && (isPhon(q) || T.cfg.listen === 'audio'), ans:LET[q.a], ex:q.ex, read:needsRead(q) ? cleanSay(q.say) : ''};
    if (q.vis) m.vis = q.vis.t === 'table' ? {kind:'table', title:q.vis.title, head:q.vis.head, rows:q.vis.rows} : {kind:'img', img:q.vis.t === 'bar' ? barImage(q.vis) : clockImage(q.vis)};
    if (q.pic && q.pic.mode === 'stem' && picOf(q, 's')) m.stemImg = await dataImg(picOf(q, 's'), 300);
    m.opts = [];

}

function parseGemini(text){
  let t = String(text || '').trim(); if (!t) throw new Error('empty');
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if (m) t = m[1];
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a < 0 || b < a) throw new Error('nojson');
  t = t.slice(a, b + 1);
  let o;
  try { o = JSON.parse(t); }
  catch (e) { o = JSON.parse(t.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/,\s*([}\]])/g, '$1')); }
  const arr = Array.isArray(o) ? o : (o.questions || o.items || [o]);
  const out = [], bad = [];
  const S0 = srcInfo(), g = Number(X.tg) || (S0 ? S0.g : 5);
  arr.forEach((x, i) => {
    const opts = (x.options || x.choices || []).map(v => String(v ?? '').trim());
    let ans = x.answer ?? x.ans; if (typeof ans === 'string') { const s = ans.trim().toUpperCase(); ans = 'ABCD'.includes(s) && s ? 'ABCD'.indexOf(s) + 1 : '①②③④'.indexOf(s) >= 0 && s ? '①②③④'.indexOf(s) + 1 : parseInt(s, 10); }
    ans = Number(ans) - 1;
    if (opts.length !== 4 || opts.some(v => !v) || !(ans >= 0 && ans < 4)) { bad.push(i + 1); return; }
    const lis = /聽/.test(String(x.part || '')) || !!String(x.script || '').trim();
    const pic = String(x.picture || '').toLowerCase();
    const q = {id:'gm' + Date.now().toString(36) + i + Math.random().toString(36).slice(2, 5), src:'gem', g, d:'rd',
      stem:String(x.stem || '').trim(), ctx:String(x.passage || '').trim(), options:opts, a:ans, ex:String(x.explanation || '').trim() || '（Gemini 未提供解析）',
      ty:String(x.type || '').trim(), from:S0 ? '改編自 ' + S0.label : '改編題'};
    if (lis) { q.say = String(x.script || '').trim(); if (/聽辨|單字|字音/.test(q.ty)) q.d = 'ph'; }
    const ip = {s:String(x.stem_image_prompt || '').trim(), o:(x.option_image_prompts || []).map(v => String(v || '').trim())};
    if (pic.startsWith('opt') || (ip.o.filter(Boolean).length >= 4 && !pic.startsWith('none'))) q.pic = {mode:'opts', opts:opts.slice()};
    else if (pic.startsWith('stem') || (ip.s && !pic.startsWith('none'))) q.pic = {mode:'stem', stem:ip.s};
    q.ip = ip;
    out.push(q);
  });
  return {out, bad};
}

async function pastComposite(p){
  await loadPack(p.k);
  const srcs = [pimgG(p), pimgQ(p)].filter(Boolean);
  const ims = []; for (const s of srcs) { const im = await imgLoad(s); if (im) ims.push(im); }
  const W = Math.max(...ims.map(i => i.naturalWidth)), H = ims.reduce((a, i) => a + i.naturalHeight + 16, 0);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  let y = 0; ims.forEach(i => { g.drawImage(i, 0, y); y += i.naturalHeight + 16; });
  return cv;
}
async function saveBlob(name, blob){

}

async function imgBytes(src, maxW, dpi){

  const cv = document.createElement('canvas'); cv.width = nw; cv.height = nh; const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, nw, nh); g.drawImage(im, 0, 0);
  let w = dpi ? nw * 96 / dpi : nw, h = dpi ? nh * 96 / dpi : nh; const sc = Math.min(1, maxW / w); w *= sc; h *= sc;

}

function docxFrom(M, d){

  const numCell = (n, lis) => cell([para(run(n + '.', {bold:true})), ...(lis ? [para(run('(聽)', {size:18, color:'555555'}))] : [])], {width:{size:NW, type:WidthType.DXA}});
  const tb = {top:none, bottom:none, left:none, right:none, insideHorizontal:none, insideVertical:none};
  const row2 = (n, lis, children) => new Table({width:{size:PW, type:WidthType.DXA}, columnWidths:[NW, CW], layout:TableLayoutType.FIXED, borders:tb, rows:[new TableRow({cantSplit:true, children:[numCell(n, lis), cell(children, {width:{size:CW, type:WidthType.DXA}})]})]});

    const ch = [];

    if (b.ctx) ch.push(para(run(''), {spacing:{after:40}}));
    if (b.stemImg) ch.push(pic(b.stemImg));
    if (b.stem) b.stem.split('\n').forEach(l => ch.push(para(run(l))));
    if (b.opts.some(o => o.img)) {

    } else {

      if (short) ch.push(para(b.opts.map((o, j) => run((j ? '　　' : '') + o.mk + ' ' + o.text))));
      else b.opts.forEach(o => ch.push(para(run(o.mk + ' ' + o.text), {indent:{left:240}, spacing:{after:30}})));

}

function pastSet(cfg){
  const g = [4,5,6,7].includes(cfg.grade) ? cfg.grade : 0;
  let pool = PAST.filter(p => (!g || p.g === g) && p.a != null && (p.p === 1 || p.sc));
  if (cfg.focus) { const f = cfg.focus; const sc = p => PTOP(p).filter(t => f.topics.includes(t)).length * 2 + ((f.types || []).includes(PTYPE_S(p)) ? 3 : 0); pool = shuffle(pool).sort((a, b) => sc(b) - sc(a)); }
  else pool = shuffle(pool);
  const picked = pool.slice(0, cfg.n);
  const qs = picked.map(p => ({id:p.id, past:p.id, d:/聽辨/.test(PTYPE(p)) ? 'ph' : 'rd', options:MARKS(p.g).map(m => m.replace(/[()]/g, '')), a:p.a, say:p.p === 0 ? p.sc : '', ex:`官方答案：${MARK(p.g, p.a)}（${PLABEL(p)}）`, g:p.g}));
  const notes = [];

  else if (qs.length < cfg.n) notes.push(`這個年級可練習的歷屆題只有 ${qs.length} 題。`);

}

  if (k === 'picdesc') { const q = T.list[Number(e.target.dataset.i)], sl = e.target.dataset.s; q.pic = q.pic || {mode:'opts'}; if (sl === 's') q.pic.stem = e.target.value; else { q.pic.opts = q.pic.opts || q.options.slice(); q.pic.opts[Number(sl)] = e.target.value; } }
  if (k === 'cpaste') T.cpaste = e.target.value;
  if (k === 'f') { const f = e.target.dataset.f; if (/^o\d$/.test(f)) T.form.o[Number(f[1])] = e.target.value; else T.form[f] = e.target.value; }
  if (k === 'title') { T.title = e.target.value; const w = document.getElementById('sheetWrap'); if (w) w.innerHTML = sheetHTML(); }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.in === 'key') { T.key = e.target.checked; const w = document.getElementById('sheetWrap'); if (w) w.innerHTML = sheetHTML(); }
});
document.addEventListener('change', async e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.in === 'loadpkg') { const f = t.files && t.files[0]; t.value = ''; if (f) await loadPkg(f); return; }
  if (t.dataset.in === 'picfile') {
    const q = T.list[Number(t.dataset.i)], f = t.files && t.files[0], sl = t.dataset.s; t.value = ''; if (!q || !f) return;
    try { const u = await fileToDataURL(f), k = imgKey(q, sl); IMG[k] = u; idbPut(k, u); T.picMsg = ''; } catch (err) { T.picMsg = '無法讀取這個圖片檔，請換 PNG 或 JPG。'; }
    return render();
  }
  if (t.dataset.in === 'picmode') { const q = T.list[Number(t.dataset.i)]; if (!t.value) delete q.pic; else q.pic = Object.assign({}, q.pic, {mode:t.value}); return render(); }
  if (t.dataset.in === 'bf') { T.bf[t.dataset.k] = t.value; return render(); }
  if (t.dataset.in === 'bq') { T.bf.q = t.value; return render(); }
  if (t.dataset.in === 'bsel') { t.checked ? T.sel.add(t.dataset.id) : T.sel.delete(t.dataset.id); return render(); }
  if (t.dataset.in === 'ed' && t.dataset.f === 'a') { T.ed.q.a = LET.indexOf(t.value); return; }
  if (t.dataset.in === 'dximg') {
    const f = t.files && t.files[0]; t.value = ''; if (!f) return;
    const url = URL.createObjectURL(f), el = new Image();
    el.onload = () => { DX.img = {el, w:el.naturalWidth, h:el.naturalHeight, r:DX.mode === 'D' ? {x0:0, y0:0, x1:100, y1:13} : {x0:0, y0:8, x1:52, y1:31}, ok:false, busy:false, result:null}; URL.revokeObjectURL(url); DX.msg = ''; render(); };
    el.onerror = () => { URL.revokeObjectURL(url); DX.msg = '無法讀取這個圖片檔，請換 PNG 或 JPG。'; render(); };
    el.src = url; return;
  }
  if (t.dataset.in === 'dxrect' && DX.img) { DX.img.r[t.dataset.k] = Number(t.value); DX.img.ok = false; return render(); }
  if (t.dataset.in === 'dxpiiok' && DX.img) { DX.img.ok = t.checked; return render(); }
  if (t.dataset.in === 'dxcnt' && DX.img && DX.img.result) { DX.img.result.rows[Number(t.dataset.n)][t.dataset.k] = t.value === '' ? null : Number(t.value); return render(); }
  if (t.dataset.in === 'dxgrade') { DX.grade = t.value; return; }
  if (t.dataset.in === 'dxst' && DX.img && DX.img.result) { DX.img.result.items[Number(t.dataset.n)].st = t.value === '' ? null : Number(t.value); return render(); }
  if (t.dataset.in === 'dxack') { DX.ack = t.checked; return render(); }
  if (t.dataset.in === 'dxexam') { DX.exam = t.value; DX.res = null; return render(); }
  if (t.dataset.in === 'dxfile') {
    const file = t.files && t.files[0]; t.value = ''; if (!file) return;
    if (/\.xlsx?$/i.test(file.name)) { DX.msg = '請先在 Excel 另存為「CSV UTF-8」再上傳。'; return render(); }
    try {
      const buf = await file.arrayBuffer(); let txt;
      try { txt = new TextDecoder('utf-8', {fatal:true}).decode(buf); } catch (_) { try { txt = new TextDecoder('big5').decode(buf); } catch (__) { txt = new TextDecoder().decode(buf); } }
      if ((DX.mode === 'C' || DX.mode === 'D') && /\.html?$/i.test(file.name)) txt = htmlToText(txt);
      return dxRun(txt);
    } catch (err) { DX.msg = '讀取檔案失敗，請確認格式。'; return render(); }
  }
  if (t.dataset.in === 'cfgsel') { const c = cfgOf(t.dataset.sc); c[t.dataset.k] = t.dataset.k === 'grade' ? Number(t.value) : t.value; c.units.clear(); return render(); }
  if (t.dataset.in === 'f' && (t.dataset.f === 'g' || t.dataset.f === 'v')) T.form[t.dataset.f] = t.value;
  if (t.dataset.in === 'cfile') {
    const file = t.files && t.files[0]; if (!file) return;
    T.currOpen = true;
    if (/\.xlsx?$/i.test(file.name)) { T.currMsg = '請先在 Excel 另存為「CSV UTF-8」再上傳。'; return render(); }
    try {
      const buf = await file.arrayBuffer(); let txt;
      try { txt = new TextDecoder('utf-8', {fatal:true}).decode(buf); } catch (_) { try { txt = new TextDecoder('big5').decode(buf); } catch (__) { txt = new TextDecoder().decode(buf); } }
      const r = ingestCurr(parseTable(txt)); T.currMsg = r.ok || r.skip.length ? `已匯入 ${r.ok} 筆教材資料。${r.skip.length ? '略過第 ' + r.skip.slice(0,10).join('、') + ' 列（缺年級或單元）。' : ''}` : '檔案是空的。';
    } catch (err) { T.currMsg = '讀取檔案失敗，請確認格式。'; }
    return render();
  }
  if (t.dataset.in === 'f' && t.dataset.f === 'd') T.form.d = t.value;
  if (t.dataset.in === 'f' && t.dataset.f === 'a') T.form.a = t.value;
  if (t.dataset.in !== 'file') return;
  const file = t.files && t.files[0]; if (!file) return;
  T.mineOpen = true;
  if (/\.xlsx?$/i.test(file.name)) { T.mineMsg = '請先在 Excel 另存為「CSV UTF-8」再上傳。'; return render(); }
  try {
    const buf = await file.arrayBuffer(); let txt;
    try { txt = new TextDecoder('utf-8', {fatal:true}).decode(buf); }
    catch (_) { try { txt = new TextDecoder('big5').decode(buf); } catch (__) { txt = new TextDecoder().decode(buf); } }
    const r = ingest(parseTable(txt)); T.mineMsg = r.ok || r.skip.length ? importMsg(r) : '檔案是空的。';
  } catch (err) { T.mineMsg = '讀取檔案失敗，請確認格式。'; }
  render();
});
document.addEventListener('toggle', e => { if (e.target.matches) { if (e.target.matches('details[data-mine]')) T.mineOpen = e.target.open; if (e.target.matches('details[data-curr]')) T.currOpen = e.target.open; if (e.target.matches('details[data-bp]')) T.bpOpen = e.target.open; } }, true);
if (hasTTS) speechSynthesis.getVoices();
render();
ready.then(() => { NOAI = true; T.cfg.src = 'bank'; render(); });
</script>
